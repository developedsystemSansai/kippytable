name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_KIPPY_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_KIPPY_SUPABASE_ANON_KEY: ci-placeholder
          NEXT_PUBLIC_LINE_CHANNEL_ID: "0"
